<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>AgentScreenshots Hover Fixture</title>
	<style>
		* { box-sizing: border-box; }
		body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6faf7; color: #17201c; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
		#hover-lab { width: min(900px, calc(100% - 36px)); border: 1px solid #dfe7e2; border-radius: 18px; background: white; padding: 30px; box-shadow: 0 24px 70px rgba(20, 30, 25, .08); }
		.nav { display: flex; gap: 16px; align-items: center; border-bottom: 1px solid #dfe7e2; padding-bottom: 20px; }
		.nav-item { position: relative; border: 1px solid #cddbd3; border-radius: 10px; padding: 10px 14px; background: #f8fbf9; font-weight: 700; }
		.flyout { position: absolute; left: 0; top: calc(100% + 10px); width: 260px; border: 1px solid #9ed0b7; border-radius: 14px; background: #eef8f3; padding: 16px; opacity: 0; transform: translateY(-8px); transition: .18s ease; pointer-events: none; }
		.nav-item:hover { border-color: #11834f; color: #11834f; }
		.nav-item:hover .flyout { opacity: 1; transform: translateY(0); }
		.hover-card-trigger { margin-top: 90px; display: inline-block; border: 1px solid #cddbd3; border-radius: 12px; padding: 16px 18px; }
		.tooltip { margin-top: 10px; width: 320px; border-radius: 12px; background: #17201c; color: white; padding: 14px; opacity: 0; transform: translateY(-6px); transition: .18s ease; }
		.hover-card-trigger:hover + .tooltip { opacity: 1; transform: none; }
	</style>
</head>
<body>
	<section id="hover-lab">
		<div class="nav">
			<div class="nav-item">Solutions
				<div class="flyout">Hover revealed this flyout before the screenshot was captured.</div>
			</div>
			<div>Docs</div>
			<div>Pricing</div>
		</div>
		<div class="hover-card-trigger">Hover tooltip target</div>
		<div class="tooltip">This tooltip proves hover-driven UI can be captured deterministically.</div>
	</section>
</body>
</html>
