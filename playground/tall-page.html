<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>AgentScreenshots Tall Page Fixture</title>
	<style>
		* { box-sizing: border-box; }
		body { margin: 0; background: #f7faf8; color: #17201c; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
		.wrap { width: min(960px, calc(100% - 36px)); margin: 0 auto; }
		header { padding: 70px 0; border-bottom: 1px solid #dfe7e2; }
		.band { min-height: 720px; display: grid; place-items: center; border-bottom: 1px solid #dfe7e2; }
		.panel { width: 100%; border: 1px solid #dfe7e2; border-radius: 18px; background: white; padding: 32px; box-shadow: 0 18px 60px rgba(20, 30, 25, .06); }
		#very-tall-section { min-height: 2600px; align-items: start; padding: 60px 0; }
	</style>
</head>
<body>
	<header><div class="wrap"><h1>Very tall page fixture</h1><p>Use this for full-page, scroll, mobile, and tall selector captures.</p></div></header>
	<section class="band"><div class="wrap panel"><h2>Section one</h2><p>Top content.</p></div></section>
	<section class="band" id="very-tall-section"><div class="wrap panel"><h2>Very tall section</h2><p>This section is intentionally tall so selector screenshots stress output dimensions.</p></div></section>
	<section class="band"><div class="wrap panel"><h2>Final section</h2><p>End of the page.</p></div></section>
</body>
</html>
